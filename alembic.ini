# Alembic configuration (docs 05 §2.1).
# sqlalchemy.url is injected by alembic/env.py from app config, not hardcoded here.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Concurrency
process_revision_directives = false

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
