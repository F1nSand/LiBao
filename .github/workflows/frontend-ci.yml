# 前端 CI（docs/05 §7）：lint + typecheck + build + 单测。
# 仓库托管到 GitHub 后生效；e2e 需安装 chromium，暂不纳入（可后续加 job）。
name: frontend-ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
