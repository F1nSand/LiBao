name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest tests/

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --project apps/backend
      - run: uv run --project apps/backend python scripts/export_openapi.py
      - run: git diff --exit-code -- contracts/openapi.json

  frontend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dependency-review:
    # GitHub only supports dependency-review for public repositories or private
    # repositories with GitHub Advanced Security enabled.  Keep the check ready
    # for the public release without making a private development repository fail.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  release:
    needs: [backend, frontend, frontend-e2e, contract, secret-scan]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: uv sync --frozen --project apps/backend
      - run: npm ci --prefix apps/frontend
      - run: python scripts/build-release.py --version ci-${{ runner.os }}
      - name: Check release contents and forbidden paths
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path
          from zipfile import ZipFile

          legacy_paths = ('C:\\Users\\Admin1', '..\\Agent', '..\\FrontEnd')
          tracked = subprocess.run(['git', 'grep', '-n', '-F', *sum((['-e', value] for value in legacy_paths), [])], capture_output=True, text=True)
          if tracked.returncode == 0:
              print(tracked.stdout)
              raise SystemExit('release-blocking personal or legacy path found')
          if tracked.returncode not in (1,):
              raise SystemExit(tracked.returncode)

          archive = Path('.artifacts/release') / f"libao-ci-{os.environ['RUNNER_OS']}.zip"
          forbidden = ('tests/', 'docs/', 'mock/', 'tools/devpanel/', 'deploy/nginx/', '.git/', 'node_modules/', '.venv/')
          with ZipFile(archive) as handle:
              names = handle.namelist()
          bad = [name for name in names if name.startswith(forbidden) or name.endswith(('.env', '.log'))]
          if bad:
              raise SystemExit(f'forbidden release entries: {bad}')
          required = {
              'backend/frontend_dist/index.html',
              'backend/scripts/check_backend_runtime.py',
              'backend/scripts/start_backend.py',
          }
          missing = sorted(required.difference(names))
          if missing:
              raise SystemExit(f'missing release entries: {missing}')
      - name: POSIX shell syntax
        if: runner.os == 'Linux'
        shell: bash
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh')
      - name: Windows wrapper validation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmd /d /c "scripts\build-release.cmd --help"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /d /c "scripts\build-release.cmd --version .."
          if ($LASTEXITCODE -eq 0) { throw 'invalid release version unexpectedly succeeded' }
