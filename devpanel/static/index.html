<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent 开发面板</title>
<style>
  :root {
    --bg: #0b0e14;
    --bg-soft: #10141d;
    --card: #151a24;
    --card-hover: #18202e;
    --border: #232b3a;
    --border-soft: #1b2230;
    --text: #e6e9f0;
    --text-dim: #8a93a6;
    --text-faint: #5b6476;
    --accent: #6366f1;
    --accent-soft: rgba(99, 102, 241, 0.14);
    --ok: #22c55e;
    --warn: #f59e0b;
    --err: #ef4444;
    --blue: #38bdf8;
    --mono: "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", monospace;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 500px at 20% -10%, #1b2140 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }

  /* ---------- 顶栏 ---------- */
  header.topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px; margin-bottom: 18px;
    background: linear-gradient(180deg, rgba(21,26,36,.85), rgba(15,19,29,.85));
    border: 1px solid var(--border-soft); border-radius: var(--radius);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 20;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo .mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, #818cf8, #4f46e5);
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px;
    box-shadow: 0 4px 14px rgba(99,102,241,.4);
  }
  .logo h1 { font-size: 16px; font-weight: 600; letter-spacing: .2px; }
  .logo .sub { font-size: 12px; color: var(--text-faint); margin-top: 1px; }
  .topbar .spacer { flex: 1; }
  .badge {
    font-family: var(--mono); font-size: 12px; color: var(--text-dim);
    background: var(--bg-soft); border: 1px solid var(--border-soft);
    padding: 5px 10px; border-radius: 20px;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .btn {
    font-size: 13px; font-weight: 500; color: var(--text);
    background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 14px; cursor: pointer;
    transition: all .15s ease; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--card-hover); border-color: #33405a; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #5254e8; }
  .btn.danger { border-color: rgba(239,68,68,.4); color: #fca5a5; }
  .btn.danger:hover { background: rgba(239,68,68,.1); }

  /* ---------- 状态栏 ---------- */
  .statusbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 14px; margin-bottom: 18px;
    background: var(--card); border: 1px solid var(--border-soft); border-radius: var(--radius);
  }
  .statusbar .hint { font-size: 12px; color: var(--text-faint); margin-right: 4px; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--mono); font-size: 12px;
    background: var(--bg-soft); border: 1px solid var(--border-soft);
    padding: 5px 10px; border-radius: 20px; cursor: default;
    transition: border-color .15s ease;
  }
  .pill.clickable { cursor: pointer; }
  .pill.clickable:hover { border-color: #33405a; }
  .pill.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .pill .port { color: var(--text-faint); }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.running { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.external { background: var(--blue); box-shadow: 0 0 8px var(--blue); }
  .dot.starting { background: var(--warn); box-shadow: 0 0 8px var(--warn); animation: pulse 1.1s infinite; }
  .dot.error { background: var(--err); box-shadow: 0 0 8px var(--err); }
  .dot.stopped { background: var(--text-faint); }
  @keyframes pulse { 50% { opacity: .35; } }

  /* ---------- 卡片 ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(560px, 1fr)); gap: 16px; }
  @media (max-width: 1180px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--border-soft); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column;
    transition: border-color .15s ease;
  }
  .card.live { border-color: #2b3550; }
  .card-head {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px; border-bottom: 1px solid var(--border-soft);
  }
  .card-ico {
    width: 34px; height: 34px; border-radius: 8px; flex: none;
    display: grid; place-items: center;
    background: var(--bg-soft); border: 1px solid var(--border-soft); color: var(--accent);
  }
  .card-ico svg { width: 18px; height: 18px; }
  .card-title { flex: 1; min-width: 0; }
  .card-title .name { font-size: 14px; font-weight: 600; }
  .card-title .detail {
    font-size: 11.5px; color: var(--text-faint); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .st {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    padding: 3px 9px; border-radius: 20px; border: 1px solid transparent;
  }
  .st.running { color: var(--ok); background: rgba(34,197,94,.1); border-color: rgba(34,197,94,.25); }
  .st.external { color: var(--blue); background: rgba(56,189,248,.1); border-color: rgba(56,189,248,.25); }
  .st.starting { color: var(--warn); background: rgba(245,158,11,.1); border-color: rgba(245,158,11,.25); }
  .st.error { color: var(--err); background: rgba(239,68,68,.1); border-color: rgba(239,68,68,.25); }
  .st.stopped { color: var(--text-dim); background: rgba(120,128,148,.1); border-color: rgba(120,128,148,.22); }
  .port-badge { font-family: var(--mono); font-size: 12px; color: var(--text-dim); }

  .card-actions {
    display: flex; gap: 8px; align-items: center;
    padding: 11px 16px; border-bottom: 1px solid var(--border-soft);
    background: rgba(10,13,20,.35);
  }
  .card-actions .spacer { flex: 1; }
  .link-btn {
    font-size: 12px; color: var(--text-dim); background: none; border: none;
    cursor: pointer; text-decoration: none; padding: 4px 6px; border-radius: 6px;
  }
  .link-btn:hover { color: var(--text); background: var(--bg-soft); }
  .logbox {
    flex: 1; min-height: 220px; max-height: 300px; overflow-y: auto;
    background: #0a0d14; font-family: var(--mono); font-size: 12px; line-height: 1.55;
    padding: 10px 12px; scrollbar-width: thin; scrollbar-color: #2b3345 transparent;
  }
  .logbox::-webkit-scrollbar { width: 9px; }
  .logbox::-webkit-scrollbar-thumb { background: #2b3345; border-radius: 6px; }
  .logbox .line { white-space: pre-wrap; word-break: break-all; color: #a9b2c5; }
  .logbox .line.cmd { color: #7dd3fc; }
  .logbox .line.panel { color: #c4b5fd; }
  .logbox .empty { color: var(--text-faint); user-select: none; }
  .logbox .follow { position: sticky; top: 0; float: right; margin-top: -4px; z-index: 5; }

  footer { margin-top: 22px; font-size: 12px; color: var(--text-faint); text-align: center; }
  footer code { font-family: var(--mono); color: var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="logo">
      <div class="mark">A</div>
      <div>
        <h1>Agent 开发面板</h1>
        <div class="sub">db · redis · backend · frontend 统一启停与日志</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="badge" id="panelBadge"><span class="dot"></span>面板 <span id="panelPort">…</span></div>
    <button class="btn primary" id="btnStartAll">全部启动</button>
    <button class="btn danger" id="btnStopAll">全部停止</button>
  </header>

  <div class="statusbar" id="statusbar">
    <span class="hint">端口占用状态</span>
    <span id="pills"></span>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    面板退出时自动回收后端 / 前端进程，容器保持运行。<code>cd Agent && uv run python -m devpanel.main</code>
  </footer>
</div>

<script>
const SVC_ICONS = {
  db: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="7" ry="2.6"/><path d="M5 5v6c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V5"/><path d="M5 11v6c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-6"/></svg>',
  redis: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.2"/><path d="M12 4v2.5M12 17.5V20M4 12h2.5M17.5 12H20M6.6 6.6l1.8 1.8M15.6 15.6l1.8 1.8M17.4 6.6l-1.8 1.8M8.4 15.6l-1.8 1.8"/></svg>',
  backend: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M6 7.5h.01M6 16.5h.01M9 7.5h.01M9 16.5h.01"/></svg>',
  frontend: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="1.5"/><path d="M3 8.5h18M8 21h8M12 18.5V21"/></svg>',
};
const ST_TEXT = { running: '运行中', starting: '启动中', error: '错误', stopped: '已停止', external: '外部' };
const cardEls = {};   // id -> {status, detail, log, box}

const grid = document.getElementById('grid');
const pillsEl = document.getElementById('pills');

async function act(svcId, action) {
  try { await fetch(`/api/services/${svcId}/${action}`, { method: 'POST' }); }
  catch (e) { console.error(e); }
}
document.getElementById('btnStartAll').onclick = () => fetch('/api/start-all', { method: 'POST' });
document.getElementById('btnStopAll').onclick = () => fetch('/api/stop-all', { method: 'POST' });

function esc(s) {
  return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}

function buildCard(svc) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-head">
      <div class="card-ico">${SVC_ICONS[svc.id] || ''}</div>
      <div class="card-title">
        <div class="name">${esc(svc.label)}</div>
        <div class="detail"></div>
      </div>
      <span class="port-badge" title="监听端口">:${svc.port}</span>
      <span class="st"></span>
    </div>
    <div class="card-actions">
      <button class="btn" data-act="start">启动</button>
      <button class="btn" data-act="restart">重启</button>
      <button class="btn danger" data-act="stop">停止</button>
      <div class="spacer"></div>
      <button class="link-btn" data-act="open">打开浏览器</button>
      <button class="link-btn" data-act="clear">清空日志</button>
    </div>
    <div class="logbox"></div>`;
  grid.appendChild(card);
  const el = {
    status: card.querySelector('.st'),
    detail: card.querySelector('.detail'),
    log: card.querySelector('.logbox'),
    card,
  };
  card.querySelectorAll('.card-actions .btn').forEach(b => {
    b.onclick = () => act(svc.id, b.dataset.act);
  });
  card.querySelector('[data-act="clear"]').onclick = () => {
    el.log.innerHTML = '<div class="empty">— 日志已清空 —</div>';
  };
  const openBtn = card.querySelector('[data-act="open"]');
  if (svc.kind === 'process') {
    openBtn.onclick = () => window.open(`http://127.0.0.1:${svc.port}${svc.open_url || '/'}`, '_blank');
  } else {
    openBtn.style.display = 'none';
  }
  cardEls[svc.id] = el;
}

function renderStatus(svc) {
  const el = cardEls[svc.id];
  if (!el) return;
  el.status.textContent = ST_TEXT[svc.status] || svc.status;
  el.status.className = 'st ' + svc.status;
  el.detail.textContent = svc.detail || '';
  el.card.classList.toggle('live', svc.status === 'running' || svc.status === 'external');
  renderPills();
}

function renderPills() {
  const svcs = Object.values(cardEls);
  if (!svcs.length) return;
  let html = '';
  for (const [id, el] of Object.entries(cardEls)) {
    const s = stateMap.get(id);
    if (!s) continue;
    html += `<span class="pill clickable" data-id="${id}"><span class="dot ${s.status}"></span>${s.label} <span class="port">:${s.port}</span></span>`;
  }
  pillsEl.innerHTML = html;
  pillsEl.querySelectorAll('.pill').forEach(p => {
    p.onclick = () => {
      const id = p.dataset.id;
      cardEls[id].card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
      p.classList.add('active');
    };
  });
}

let stateMap = new Map();
function setSvcState(svc) {
  stateMap.set(svc.id, svc);
  renderStatus(svc);
}

function appendLine(id, line, kind) {
  const el = cardEls[id];
  if (!el) return;
  const box = el.log;
  const follow = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  if (box.querySelector('.empty')) box.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'line' + (kind ? ' ' + kind : '');
  d.textContent = line;
  box.appendChild(d);
  if (follow) box.scrollTop = box.scrollHeight;
}

// ---------- SSE ----------
const es = new EventSource('/api/events');
es.addEventListener('panel', e => {
  const d = JSON.parse(e.data);
  document.getElementById('panelPort').textContent = ':' + d.port;
});
es.addEventListener('snapshot', e => {
  const d = JSON.parse(e.data);
  d.services.forEach(svc => {
    if (!cardEls[svc.id]) buildCard(svc);
    setSvcState(svc);
  });
});
es.addEventListener('status', e => {
  const s = JSON.parse(e.data);
  setSvcState(s);
});
es.addEventListener('log', e => {
  const d = JSON.parse(e.data);
  appendLine(d.id, d.line, d.line.startsWith('$ ') ? 'cmd' : (d.line.startsWith('[devpanel]') ? 'panel' : ''));
});
es.onerror = () => { /* EventSource 自动重连 */ };
</script>
</body>
</html>
