<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent 开发面板</title>
<style>
  :root {
    --bg: #f0f6ff;
    --bg-grad: #dbeafe;
    --card: #ffffff;
    --card-hover: #f8fbff;
    --border: #d5e4f7;
    --border-soft: #e6eef8;
    --text: #1e293b;
    --text-dim: #64748b;
    --text-faint: #94a3b8;
    --accent: #3b82f6;
    --accent-dark: #2563eb;
    --accent-soft: rgba(59, 130, 246, 0.12);
    --ok: #059669;
    --warn: #d97706;
    --err: #dc2626;
    --blue: #0ea5e9;
    --shadow: 0 4px 20px rgba(59, 130, 246, 0.08);
    --shadow-hover: 0 8px 26px rgba(59, 130, 246, 0.14);
    --mono: "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", monospace;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 520px at 15% -12%, #bfdbfe 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }

  /* ---------- 顶栏 ---------- */
  header.topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 13px 18px; margin-bottom: 18px;
    background: rgba(255, 255, 255, 0.82);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
    position: sticky; top: 12px; z-index: 20;
  }
  .logo { display: flex; align-items: center; gap: 11px; }
  .logo .mark {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, #3b82f6, #0ea5e9);
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px;
    box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
  }
  .logo h1 { font-size: 16px; font-weight: 700; letter-spacing: .2px; color: var(--text); }
  .logo .sub { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
  .topbar .spacer { flex: 1; }
  .badge {
    font-family: var(--mono); font-size: 12px; color: var(--text-dim);
    background: var(--bg); border: 1px solid var(--border);
    padding: 5px 11px; border-radius: 20px;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .btn {
    font-size: 13px; font-weight: 500; color: var(--text);
    background: #fff; border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 14px; cursor: pointer;
    transition: all .15s ease; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--bg); border-color: var(--accent); color: var(--accent-dark); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible, .link-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 2px 10px rgba(59,130,246,.3); }
  .btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
  .btn.danger { border-color: rgba(239,68,68,.35); color: #dc2626; }
  .btn.danger:hover { background: #fef2f2; border-color: #fca5a5; color: #b91c1c; }

  /* ---------- 状态栏 ---------- */
  .statusbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 14px; margin-bottom: 18px;
    background: var(--card); border: 1px solid var(--border-soft); border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .statusbar .hint { font-size: 12px; color: var(--text-faint); margin-right: 4px; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--mono); font-size: 12px;
    background: #fff; border: 1px solid var(--border);
    padding: 5px 11px; border-radius: 20px; cursor: default;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .pill.clickable { cursor: pointer; }
  .pill.clickable:hover { border-color: var(--accent); background: var(--bg); }
  .pill.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--bg); }
  .pill .port { color: var(--text-faint); }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.running { background: var(--ok); box-shadow: 0 0 8px rgba(5,150,105,.5); }
  .dot.external { background: var(--blue); box-shadow: 0 0 8px rgba(14,165,233,.5); }
  .dot.starting { background: var(--warn); box-shadow: 0 0 8px rgba(217,119,6,.5); animation: pulse 1.1s infinite; }
  .dot.error { background: var(--err); box-shadow: 0 0 8px rgba(220,38,38,.5); }
  .dot.stopped { background: #cbd5e1; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* ---------- 卡片 ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(560px, 1fr)); gap: 18px; }
  @media (max-width: 1180px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--border-soft); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column;
    box-shadow: var(--shadow);
    transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .card:hover { border-color: var(--border); box-shadow: var(--shadow-hover); }
  .card.live { border-color: var(--accent); }
  .card-head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; border-bottom: 1px solid var(--border-soft);
  }
  .card-ico {
    width: 36px; height: 36px; border-radius: 9px; flex: none;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #eff6ff, #e0f2fe);
    border: 1px solid var(--border); color: var(--accent);
  }
  .card-ico svg { width: 18px; height: 18px; }
  .card-title { flex: 1; min-width: 0; }
  .card-title .name { font-size: 14px; font-weight: 600; color: var(--text); }
  .card-title .detail {
    font-size: 11.5px; color: var(--text-faint); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .st {
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    padding: 3px 10px; border-radius: 20px; border: 1px solid transparent;
  }
  .st.running { color: var(--ok); background: rgba(5,150,105,.1); border-color: rgba(5,150,105,.25); }
  .st.external { color: var(--blue); background: rgba(14,165,233,.1); border-color: rgba(14,165,233,.25); }
  .st.starting { color: var(--warn); background: rgba(217,119,6,.1); border-color: rgba(217,119,6,.25); }
  .st.error { color: var(--err); background: rgba(220,38,38,.1); border-color: rgba(220,38,38,.25); }
  .st.stopped { color: var(--text-dim); background: rgba(100,116,139,.1); border-color: rgba(100,116,139,.22); }
  .port-badge {
    font-family: var(--mono); font-size: 12px; color: var(--text-dim);
    background: var(--bg); border: 1px solid var(--border-soft);
    padding: 2px 8px; border-radius: 6px;
  }

  .card-actions {
    display: flex; gap: 8px; align-items: center;
    padding: 11px 16px; border-bottom: 1px solid var(--border-soft);
    background: rgba(240, 246, 255, 0.5);
  }
  .card-actions .spacer { flex: 1; }
  .link-btn {
    font-size: 12px; color: var(--text-dim); background: none; border: none;
    cursor: pointer; text-decoration: none; padding: 4px 6px; border-radius: 6px;
    transition: all .15s ease;
  }
  .link-btn:hover { color: var(--accent-dark); background: var(--bg); }
  .logbox {
    flex: 1; min-height: 220px; max-height: 300px; overflow-y: auto;
    background: #f8fafc; font-family: var(--mono); font-size: 12px; line-height: 1.55;
    padding: 10px 12px; scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent;
  }
  .logbox::-webkit-scrollbar { width: 9px; }
  .logbox::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
  .logbox::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  .logbox .line { white-space: pre-wrap; word-break: break-all; color: #475569; }
  .logbox .line.cmd { color: #0369a1; }
  .logbox .line.panel { color: #6d28d9; }
  .logbox .empty { color: var(--text-faint); user-select: none; }
  .logbox .follow { position: sticky; top: 0; float: right; margin-top: -4px; z-index: 5; }

  footer { margin-top: 24px; font-size: 12px; color: var(--text-faint); text-align: center; }
  footer code { font-family: var(--mono); color: var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="logo">
      <div class="mark">A</div>
      <div>
        <h1>Agent 开发面板</h1>
        <div class="sub">backend · frontend 统一启停与日志</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="badge" id="panelBadge"><span class="dot"></span>面板 <span id="panelPort">…</span></div>
    <button class="btn primary" id="btnStartAll">全部启动</button>
    <button class="btn danger" id="btnStopAll">全部停止</button>
  </header>

  <div class="statusbar" id="statusbar">
    <span class="hint">端口占用状态</span>
    <span id="pills"></span>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    面板退出时自动回收后端 / 前端进程。<code>cd DevPanel && uv run python main.py</code>
  </footer>
</div>

<script>
const SVC_ICONS = {
  backend: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M6 7.5h.01M6 16.5h.01M9 7.5h.01M9 16.5h.01"/></svg>',
  frontend: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="1.5"/><path d="M3 8.5h18M8 21h8M12 18.5V21"/></svg>',
};
const ST_TEXT = { running: '运行中', starting: '启动中', error: '错误', stopped: '已停止', external: '外部' };
const cardEls = {};   // id -> {status, detail, log, box}

const grid = document.getElementById('grid');
const pillsEl = document.getElementById('pills');

async function act(svcId, action) {
  try { await fetch(`/api/services/${svcId}/${action}`, { method: 'POST' }); }
  catch (e) { console.error(e); }
}
document.getElementById('btnStartAll').onclick = () => fetch('/api/start-all', { method: 'POST' });
document.getElementById('btnStopAll').onclick = () => fetch('/api/stop-all', { method: 'POST' });

function esc(s) {
  return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}

function buildCard(svc) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-head">
      <div class="card-ico">${SVC_ICONS[svc.id] || ''}</div>
      <div class="card-title">
        <div class="name">${esc(svc.label)}</div>
        <div class="detail"></div>
      </div>
      <span class="port-badge" title="监听端口">:${svc.port}</span>
      <span class="st"></span>
    </div>
    <div class="card-actions">
      <button class="btn" data-act="start">启动</button>
      <button class="btn" data-act="restart">重启</button>
      <button class="btn danger" data-act="stop">停止</button>
      <div class="spacer"></div>
      <button class="link-btn" data-act="open">打开浏览器</button>
      <button class="link-btn" data-act="clear">清空日志</button>
    </div>
    <div class="logbox"></div>`;
  grid.appendChild(card);
  const el = {
    status: card.querySelector('.st'),
    detail: card.querySelector('.detail'),
    log: card.querySelector('.logbox'),
    card,
  };
  card.querySelectorAll('.card-actions .btn').forEach(b => {
    b.onclick = () => act(svc.id, b.dataset.act);
  });
  card.querySelector('[data-act="clear"]').onclick = () => {
    el.log.innerHTML = '<div class="empty">— 日志已清空 —</div>';
  };
  const openBtn = card.querySelector('[data-act="open"]');
  openBtn.onclick = () => window.open(`http://127.0.0.1:${svc.port}${svc.open_url || '/'}`, '_blank');
  cardEls[svc.id] = el;
}

function renderStatus(svc) {
  const el = cardEls[svc.id];
  if (!el) return;
  el.status.textContent = ST_TEXT[svc.status] || svc.status;
  el.status.className = 'st ' + svc.status;
  el.detail.textContent = svc.detail || '';
  el.card.classList.toggle('live', svc.status === 'running' || svc.status === 'external');
  renderPills();
}

function renderPills() {
  const svcs = Object.values(cardEls);
  if (!svcs.length) return;
  let html = '';
  for (const [id, el] of Object.entries(cardEls)) {
    const s = stateMap.get(id);
    if (!s) continue;
    html += `<span class="pill clickable" data-id="${id}"><span class="dot ${s.status}"></span>${s.label} <span class="port">:${s.port}</span></span>`;
  }
  pillsEl.innerHTML = html;
  pillsEl.querySelectorAll('.pill').forEach(p => {
    p.onclick = () => {
      const id = p.dataset.id;
      cardEls[id].card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
      p.classList.add('active');
    };
  });
}

let stateMap = new Map();
function setSvcState(svc) {
  stateMap.set(svc.id, svc);
  renderStatus(svc);
}

function appendLine(id, line, kind) {
  const el = cardEls[id];
  if (!el) return;
  const box = el.log;
  const follow = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  if (box.querySelector('.empty')) box.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'line' + (kind ? ' ' + kind : '');
  d.textContent = line;
  box.appendChild(d);
  if (follow) box.scrollTop = box.scrollHeight;
}

// ---------- SSE ----------
const es = new EventSource('/api/events');
es.addEventListener('panel', e => {
  const d = JSON.parse(e.data);
  document.getElementById('panelPort').textContent = ':' + d.port;
});
es.addEventListener('snapshot', e => {
  const d = JSON.parse(e.data);
  d.services.forEach(svc => {
    if (!cardEls[svc.id]) buildCard(svc);
    setSvcState(svc);
  });
});
es.addEventListener('status', e => {
  const s = JSON.parse(e.data);
  setSvcState(s);
});
es.addEventListener('log', e => {
  const d = JSON.parse(e.data);
  appendLine(d.id, d.line, d.line.startsWith('$ ') ? 'cmd' : (d.line.startsWith('[devpanel]') ? 'panel' : ''));
});
es.onerror = () => { /* EventSource 自动重连 */ };
</script>
</body>
</html>
